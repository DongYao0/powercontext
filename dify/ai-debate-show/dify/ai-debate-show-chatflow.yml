    - id: llm_settlement
      type: custom
      position: {x: 3980, y: 560}
      width: 244
      height: 118
      data:
        type: llm
        title: 第三回合综艺结算
        desc: 产出荒谬指数、人设、名言与记忆候选。
        model:
          provider: langgenius/deepseek/deepseek
          name: deepseek-chat
          mode: chat
          completion_params:
            temperature: 0.7
            max_tokens: 4096
        prompt_template:
        - id: prompt-settlement
          role: system
          text: |
            你是综艺节目《再说一遍？AI 记仇辩论夜》的结算导演。第三回合结束后，你要给这一局收尾。

            ## 本局事实（全部来自节目组后台，是事实，不要改写、不要补充）
            - 辩题：{{#conversation.topic_title#}}（辩题编号：{{#start.topic_id#}}）
            - 本局最终立场：{{#code_parse_round.current_stance#}}
            - 本局回合数：{{#code_parse_round.round_number#}}
            - 玩家第三回合原话：{{#code_action.player_message#}}
            - 历史档案状态：{{#conversation.memory_status#}}
            - 历史档案内容：{{#conversation.memory_context#}}

            ## 硬性规则
            1. 只能使用上面列出的事实，不要杜撰玩家的历史发言，也不要编造玩家的真实身份。
            2. 荒谬指数只评价节目效果，不评价玩家的智力、人格或现实身份；给 0 到 100 的整数。
            3. 必须把"本局最终立场"和"反转事件"分开写：玩家中途换过立场就写清什么时候换的、为什么换；没换过就写"本局没有反转"。
            4. "历史档案状态"是 degraded 或"历史档案内容"为空时，不得声称记得玩家过去的发言。
            5. 记忆候选的类型只能是 stance、quote、persona、promise、reversal、catchphrase 六选一。
            6. 记忆候选正文不超过 120 个中文字符；写入理由不超过 512 个字符。
            7. 不评价玩家，不泄露内部说法：不要出现"卡片""节点""数据库""HTTP""接口""API""JSON""字段""后台""模型""参数""服务"等词。
            8. 本局到此结束，不要邀请第四回合。

            ## 输出格式
            只输出一个 JSON 对象。不要用 Markdown 代码块，不要写解释、前后缀或任何多余文字。字段如下：
            {
              "settlement_text": "结算口播，3 到 5 句，负责报荒谬指数、点出人设、抛出代表性名言",
              "absurdity_score": 58,
              "persona": "本局给玩家安的一个节目内人设，一句话，不评价真人",
              "signature_quote": "本局最有代表性的一句玩家原话，20 个字以内",
              "final_stance": "本局最终立场，原样照抄",
              "reversal_event": "本局的反转事件；本局没有反转就写本局没有反转",
              "memory_candidate": {
                "kind": "stance",
                "text": "留给下一局翻旧账用的记忆正文，不超过 120 个中文字符",
                "reason": "为什么值得记下来，不超过 512 个字符"
              }
            }
        variables: []
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
        retry_config:
          retry_enabled: true
          max_retries: 2
          retry_interval: 1000
        error_strategy: default-value
        default_value:
        - key: text
          type: string
          value: '{"settlement_text":"【本局结算】三回合结束，本局收工。"}'
    - id: code_parse_settlement
      type: custom
      position: {x: 4280, y: 560}
      width: 244
      height: 120
      data:
        type: code
        title: 解析结算结果
        desc: 取出结算口播与记忆候选，并卡住长度上限。
        code_language: python3
        code: |
          import json

          ALLOWED_KINDS = ("stance", "quote", "persona", "promise", "reversal", "catchphrase")
          MAX_TEXT = 120
          MAX_REASON = 512
          MARKS = ("。", "！", "？", "；", "，", ".", "!", "?", ";", ",")


          def _clip(value, limit):
              text = value.strip() if isinstance(value, str) else ""
              if len(text) <= limit:
                  return text
              head = text[:limit]
              for mark in MARKS:
                  index = head.rfind(mark)
                  if index >= limit // 2:
                      return head[: index + 1]
              return head[: limit - 1] + "…"


          def _text(value):
              return value if isinstance(value, str) else ""


          def main(text, current_stance, player_message):
              raw = (text or "").strip()
              if raw.startswith("```"):
                  raw = "\n".join(
                      line for line in raw.splitlines() if not line.strip().startswith("```")
                  ).strip()

              data = {}
              try:
                  parsed = json.loads(raw)
                  if isinstance(parsed, dict):
                      data = parsed
              except Exception:
                  data = {}

              candidate = data.get("memory_candidate")
              if not isinstance(candidate, dict):
                  candidate = {}

              kind = _text(candidate.get("kind")).strip()
              if kind not in ALLOWED_KINDS:
                  kind = "stance"

              memory_text = _clip(_text(candidate.get("text")), MAX_TEXT)
              reason = _clip(_text(candidate.get("reason")), MAX_REASON)
              if not memory_text:
                  memory_text = _clip(
                      "玩家在" + (current_stance or "本局") + "立场上的表态。", MAX_TEXT
                  )
              if not reason:
                  reason = "属于与本局对局直接相关的立场与理由。"

              score = data.get("absurdity_score")
              if isinstance(score, bool) or not isinstance(score, (int, float)):
                  score = 0
              score = max(0, min(100, int(score)))

              persona = _text(data.get("persona")).strip()
              quote = _text(data.get("signature_quote")).strip()
              final_stance = _text(data.get("final_stance")).strip() or current_stance
              reversal = _text(data.get("reversal_event")).strip() or "本局没有反转"

              settlement = _text(data.get("settlement_text")).strip()
              if not settlement:
                  settlement = (
                      "【本局结算】荒谬指数 " + str(score) + "。\n"
                      "【当前人设】" + (persona or "这一局的临时人设还没立住") + "\n"
                      "【代表性名言】" + (quote or "本局没有留下金句") + "\n"
                      "三回合结束，本局收工。"
                  )

              return {
                  "settlement_text": settlement,
                  "absurdity_score": str(score),
                  "persona": persona,
                  "signature_quote": quote,
                  "final_stance": final_stance,
                  "reversal_event": reversal,
                  "memory_kind": kind,
                  "memory_text": memory_text,
                  "memory_reason": reason,
              }
        variables:
        - variable: text
          value_selector: [llm_settlement, text]
        - variable: current_stance
          value_selector: [code_parse_round, current_stance]
        - variable: player_message
          value_selector: [code_action, player_message]
        outputs:
          settlement_text:
            type: string
            children: null
          absurdity_score:
            type: string
            children: null
          persona:
            type: string
            children: null
          signature_quote:
            type: string
            children: null
          final_stance:
            type: string
            children: null
          reversal_event:
            type: string
            children: null
          memory_kind:
            type: string
            children: null
          memory_text:
            type: string
            children: null
          memory_reason:
            type: string
            children: null
