components:
  schemas:
    AccountUser:
      properties:
        account_identifier:
          description: 规范化后的账号标识
          title: Account Identifier
          type: string
        id:
          title: Id
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        timezone:
          description: IANA 时区名
          title: Timezone
          type: string
      required:
      - id
      - account_identifier
      - role
      - timezone
      title: AccountUser
      type: object
    ActivatePlanRequest:
      properties:
        draft_plan_id:
          maxLength: 36
          title: Draft Plan Id
          type: string
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        planning_revision:
          description: 客户端读到的 planning revision；必填非负整数，启用时用于检查排期输入是否过期
          minimum: 0.0
          title: Planning Revision
          type: integer
      required:
      - expected_revision
      - draft_plan_id
      - planning_revision
      title: ActivatePlanRequest
      type: object
    ActivationResponse:
      description: 启用结果。幂等：重复请求返回同一结果，不重复创建任务（12 号第 7 节）。
      properties:
        activated_at:
          format: date-time
          title: Activated At
          type: string
        first_batch_window:
          additionalProperties: true
          description: 首个批次的 window_start / window_end
          title: First Batch Window
          type: object
        goal_id:
          title: Goal Id
          type: string
        plan_version_id:
          description: 切换为 active 的计划版本；目标状态同步 draft → active（T04 决策 A10）
          title: Plan Version Id
          type: string
        start_date_notice:
          anyOf:
          - $ref: '#/components/schemas/StartDateNotice'
          - type: 'null'
          description: 开始日无可安排用户任务时的非阻断提示
      required:
      - goal_id
      - plan_version_id
      - first_batch_window
      - activated_at
      title: ActivationResponse
      type: object
    AffectedDependency:
      description: 暂停目标时受影响的跨目标依赖项。取值由 T06 的依赖图计算，接入前恒为空列表（T04 决策 A12）。
      properties:
        goal_id:
          description: 依赖方（后继任务）所属目标
          title: Goal Id
          type: string
        task_id:
          description: 将被计算态 blocked 的后继任务
          title: Task Id
          type: string
      required:
      - goal_id
      - task_id
      title: AffectedDependency
      type: object
    AgendaItemView:
      description: 当日一个任务的分配（13 号第 1 节 agenda_items）。首版没有起止时刻（R06）。
      properties:
        allocated_minutes:
          description: 分配分钟数；不超过任务剩余预计分钟
          exclusiveMinimum: 0.0
          title: Allocated Minutes
          type: integer
        rank:
          description: 当日执行顺序
          minimum: 1.0
          title: Rank
          type: integer
        reason_codes:
          description: 排序键、所选层级及原因码（13 号第 4 节）
          items:
            $ref: '#/components/schemas/SchedulingReasonCode'
          title: Reason Codes
          type: array
        task:
          anyOf:
          - $ref: '#/components/schemas/AgendaTaskView'
          - type: 'null'
          description: 展示用任务摘要；业务实现接线前为空
        task_id:
          title: Task Id
          type: string
        task_spec_id:
          description: 排期所依据的任务内容版本
          title: Task Spec Id
          type: string
      required:
      - task_id
      - task_spec_id
      - rank
      - allocated_minutes
      - reason_codes
      title: AgendaItemView
      type: object
    AgendaResponse:
      description: '某日的当前安排（05-module-contracts read_today）。


        读取不直接创建作业：尚无排期结果时 current 为 null，前端据此调用 generation 端点。'
      properties:
        current:
          anyOf:
          - $ref: '#/components/schemas/AgendaRevisionView'
          - type: 'null'
          description: 当前生效的排期结果；尚无时为 null
        local_date:
          format: date
          title: Local Date
          type: string
        planning_revision:
          description: 当前排期协调入口版本
          minimum: 0.0
          title: Planning Revision
          type: integer
        recorded_today:
          description: 当日已有有效执行记录的任务；业务实现接线前为空
          items:
            $ref: '#/components/schemas/RecordedTaskView'
          title: Recorded Today
          type: array
      required:
      - local_date
      - planning_revision
      - current
      title: AgendaResponse
      type: object
    AgendaRevisionStatus:
      description: 单次排期结果状态（03 第 4 节 agenda_revisions.status）。
      enum:
      - ready
      - conflicted
      title: AgendaRevisionStatus
      type: string
    AgendaRevisionView:
      description: 一次排期计算的完整结果（13 号第 1 节 SchedulingResult 的持久化形状）。
      properties:
        capacity:
          $ref: '#/components/schemas/CapacitySummaryView'
        change_proposals:
          items:
            $ref: '#/components/schemas/ChangeProposalView'
          title: Change Proposals
          type: array
        conflicts:
          items:
            $ref: '#/components/schemas/ConflictView'
          title: Conflicts
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        deferred:
          items:
            $ref: '#/components/schemas/DeferredTaskView'
          title: Deferred
          type: array
        id:
          title: Id
          type: string
        input_planning_revision:
          description: 计算基于的 planning revision
          minimum: 0.0
          title: Input Planning Revision
          type: integer
        items:
          items:
            $ref: '#/components/schemas/AgendaItemView'
          title: Items
          type: array
        scheduling_policy_version:
          description: 当时按哪版排期策略判定（Q08 可解释）
          title: Scheduling Policy Version
          type: string
        status:
          $ref: '#/components/schemas/AgendaRevisionStatus'
        version_no:
          minimum: 1.0
          title: Version No
          type: integer
      required:
      - id
      - version_no
      - status
      - input_planning_revision
      - scheduling_policy_version
      - capacity
      - items
      - deferred
      - conflicts
      - change_proposals
      - created_at
      title: AgendaRevisionView
      type: object
    AgendaTaskView:
      description: '今日页展示任务所需的摘要：标题、所属目标、执行状态与任务版本（T11 决策 A18）。


        `revision` 是开始、记录反馈、更正与解决阻碍要带的 expected_revision。读取排期时填充，

        读取接口本身不创建作业。'
      properties:
        completion_criteria:
          description: 任务的完成标准
          items:
            $ref: '#/components/schemas/CompletionCriterionView'
          title: Completion Criteria
          type: array
        execution_status:
          $ref: '#/components/schemas/TaskExecutionStatus'
        executor:
          $ref: '#/components/schemas/TaskExecutor'
        goal_id:
          title: Goal Id
          type: string
        goal_title:
          title: Goal Title
          type: string
        instructions:
          title: Instructions
          type: string
        latest_checkin:
          anyOf:
          - $ref: '#/components/schemas/LatestCheckinView'
          - type: 'null'
          description: 最近一条有效执行记录，用于更正；没有记录或业务实现接线前为空
        open_blockers:
          description: 尚未解决的持久阻碍；业务实现接线前为空
          items:
            $ref: '#/components/schemas/OpenBlockerView'
          title: Open Blockers
          type: array
        revision:
          description: 任务版本，作为各执行写操作的 expected_revision
          minimum: 0.0
          title: Revision
          type: integer
        title:
          title: Title
          type: string
      required:
      - title
      - instructions
      - goal_id
      - goal_title
      - executor
      - execution_status
      - revision
      - completion_criteria
      title: AgendaTaskView
      type: object
    ArtifactKind:
      description: 材料形态（D10：粘贴文本 / 文件 / 公开链接）。文件类型白名单在请求层校验。
      enum:
      - pasted_text
      - file
      - link
      title: ArtifactKind
      type: string
    ArtifactResponse:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        file_name:
          anyOf:
          - type: string
          - type: 'null'
          title: File Name
        id:
          title: Id
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Bytes
        status:
          title: Status
          type: string
        task_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Id
        text_content:
          anyOf:
          - type: string
          - type: 'null'
          description: 粘贴文本材料的内容；其他形态为空
          title: Text Content
        url:
          anyOf:
          - type: string
          - type: 'null'
          description: 链接材料的地址；其他形态为空
          title: Url
      required:
      - id
      - task_id
      - kind
      - status
      - created_at
      title: ArtifactResponse
      type: object
    AuthSessionResponse:
      description: 当前用户与会话元数据。不包含会话令牌。
      properties:
        session:
          $ref: '#/components/schemas/SessionInfo'
        user:
          $ref: '#/components/schemas/AccountUser'
      required:
      - user
      - session
      title: AuthSessionResponse
      type: object
    AutoRouteNotCreated:
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/AutoRouteUnavailableReason'
        status:
          const: not_created
          title: Status
          type: string
      required:
      - status
      - reason
      title: AutoRouteNotCreated
      type: object
    AutoRouteSubmitted:
      additionalProperties: false
      properties:
        job_id:
          description: 首次自动作业；当前状态仍查询 jobs 接口
          maxLength: 36
          minLength: 1
          title: Job Id
          type: string
        status:
          const: submitted
          title: Status
          type: string
      required:
      - status
      - job_id
      title: AutoRouteSubmitted
      type: object
    AutoRouteUnavailableReason:
      enum:
      - chat_default_unavailable
      - reasoning_binding_unavailable
      - model_config_changed
      title: AutoRouteUnavailableReason
      type: string
    AvailabilityVersionResponse:
      description: 周额度版本（03 第 4 节 availability_versions）。
      properties:
        coordination_required:
          description: 已有安排需要协调时为 true（05-module-contracts update_availability）
          title: Coordination Required
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        effective_from:
          description: 生效起始日期；按日期选择使用的版本
          format: date
          title: Effective From
          type: string
        id:
          title: Id
          type: string
        revision:
          description: 服务端当前版本号
          minimum: 0.0
          title: Revision
          type: integer
        version_no:
          minimum: 1.0
          title: Version No
          type: integer
        weekly_minutes:
          additionalProperties:
            type: integer
          description: 周一至周日七个额度（分钟），键为 monday…sunday
          title: Weekly Minutes
          type: object
      required:
      - revision
      - id
      - effective_from
      - weekly_minutes
      - version_no
      - created_at
      - coordination_required
      title: AvailabilityVersionResponse
      type: object
    BlockerKind:
      description: 持久阻碍的类型（09 号第 1 节"记录阻碍类型和说明"；03 第 5 节 task_blockers）。
      enum:
      - missing_material
      - capability_gap
      - time_conflict
      - external_dependency
      - unclear_requirement
      - other
      title: BlockerKind
      type: string
    BlockerResponse:
      properties:
        blocker_kind:
          $ref: '#/components/schemas/BlockerKind'
        created_at:
          format: date-time
          title: Created At
          type: string
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        resolved_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Resolved At
        status:
          $ref: '#/components/schemas/BlockerStatus'
        task_id:
          title: Task Id
          type: string
      required:
      - id
      - task_id
      - blocker_kind
      - description
      - status
      - resolved_at
      - created_at
      title: BlockerResponse
      type: object
    BlockerStatus:
      description: 阻碍生命周期：开放阻碍参与 blocked 计算，解决后自动解除（14 号第 3 节）。
      enum:
      - open
      - resolved
      title: BlockerStatus
      type: string
    Body_create_artifact_api_tasks__task_id__artifacts_post:
      properties:
        file:
          anyOf:
          - contentMediaType: application/octet-stream
            type: string
          - type: 'null'
          title: File
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        text_content:
          anyOf:
          - maxLength: 100000
            type: string
          - type: 'null'
          title: Text Content
        url:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Url
      required:
      - kind
      title: Body_create_artifact_api_tasks__task_id__artifacts_post
      type: object
    CancelJobRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: CancelJobRequest
      type: object
    CapabilityState:
      description: '模型能力的三态记录（07 号文档第 1 节）。


        LangChain 在部分 provider 上用提示工程模拟结构化输出，这种情况记为

        unsupported 而不是 supported——不伪报原生能力。'
      enum:
      - supported
      - unsupported
      - unknown
      title: CapabilityState
      type: string
    CapacityBasis:
      description: '当日容量的额度口径（13 号第 1 节 capacity_summary 的"额度来源"，取值为 T05 决策 A9）。


        total 按"全天额度 − 已投入"计剩余；remaining 从用户声明时点起扣除，

        不重复扣减已投入时间（03 第 4 节）。'
      enum:
      - total
      - remaining
      title: CapacityBasis
      type: string
    CapacitySummaryView:
      description: 当日额度汇总（13 号第 1 节 capacity_summary：额度来源、已投入、已保留和剩余分钟）。
      properties:
        basis:
          $ref: '#/components/schemas/CapacityBasis'
          description: 额度口径；total 按全天扣已投入，remaining 从声明时点起扣
        quota_minutes:
          description: 当日有效额度（分钟）
          minimum: 0.0
          title: Quota Minutes
          type: integer
        remaining_minutes:
          description: 当前剩余容量（分钟）
          minimum: 0.0
          title: Remaining Minutes
          type: integer
        reserved_minutes:
          description: 已保留（分钟）
          minimum: 0.0
          title: Reserved Minutes
          type: integer
        spent_minutes:
          description: 今日已投入（分钟）
          minimum: 0.0
          title: Spent Minutes
          type: integer
      required:
      - basis
      - quota_minutes
      - spent_minutes
      - reserved_minutes
      - remaining_minutes
      title: CapacitySummaryView
      type: object
    ChangeClass:
      description: '变更提案的判级（03 第 3 节 change_class，取值出处 18 号第 3 节、D04）。


        本期只含目标关联解除所需的两级；record_only / auto_schedule / auto_plan_local

        归 T12，届时随其契约 PR 扩展 CHECK（T06 决策 A5）。'
      enum:
      - confirmation_required
      - profile_revision_required
      title: ChangeClass
      type: string
    ChangePasswordRequest:
      properties:
        current_password:
          format: password
          maxLength: 1024
          title: Current Password
          type: string
          writeOnly: true
        new_password:
          description: 12–128 个字符，不得与账号标识相同
          format: password
          maxLength: 1024
          title: New Password
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
      title: ChangePasswordRequest
      type: object
    ChangeProposalActionRequest:
      description: 提案终态动作（接受 / 拒绝）。接受和应用在同一事务完成（03 第 3 节）。
      properties: {}
      title: ChangeProposalActionRequest
      type: object
    ChangeProposalResponse:
      description: 变更提案。解除关联时 change_class=confirmation_required（改变成功标准时升级，18 号第 3 节）。
      properties:
        accepted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Accepted At
        applied_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Applied At
        change_class:
          $ref: '#/components/schemas/ChangeClass'
        created_at:
          format: date-time
          title: Created At
          type: string
        goal_id:
          title: Goal Id
          type: string
        id:
          title: Id
          type: string
        impact:
          $ref: '#/components/schemas/UnlinkImpact'
        input_revision:
          description: 提案生成时的 planning revision；落后于当前值即为 stale（T06 决策 A6）
          title: Input Revision
          type: integer
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        status:
          $ref: '#/components/schemas/ChangeProposalStatus'
          description: 提案基础版本已变时为 stale，不沿用旧确认
      required:
      - id
      - goal_id
      - change_class
      - status
      - input_revision
      - impact
      - reason
      - created_at
      - accepted_at
      - applied_at
      title: ChangeProposalResponse
      type: object
    ChangeProposalStatus:
      description: '变更提案状态（03 第 3 节 change_proposals.status）。


        接受和应用在同一事务完成；提案基础版本已变时置 stale。'
      enum:
      - pending
      - applied
      - rejected
      - stale
      title: ChangeProposalStatus
      type: string
    ChangeProposalView:
      description: '需要用户确认的变更建议（13 号第 6 节 pending change proposal）。


        里程碑延期、增加总投入、降低某目标投入、移动用户锁定/进行中任务或影响

        关联目标时不自动执行，生成待确认建议（D06）。'
      properties:
        description:
          description: 建议内容与理由
          title: Description
          type: string
        proposal_type:
          description: 建议类型：deadline_extension / increase_investment / reduce_investment / move_locked_task
            / cross_goal_impact（取值随业务实现固定）
          title: Proposal Type
          type: string
        requires_confirmation:
          default: true
          description: 首版建议一律待确认（D06）
          title: Requires Confirmation
          type: boolean
        task_ids:
          description: 涉及的任务
          items:
            type: string
          title: Task Ids
          type: array
      required:
      - proposal_type
      - description
      title: ChangeProposalView
      type: object
    CheckinDifficulty:
      description: 可选的主观难度感受（09 号第 3 节"耗时和感受"）。缺失即 unknown，不推断。
      enum:
      - easy
      - manageable
      - hard
      title: CheckinDifficulty
      type: string
    CheckinOutcome:
      description: 执行反馈的动作结果（03 第 5 节；09 号第 1 节六动作映射到四值 + start 端点）。
      enum:
      - completed
      - partial
      - deferred_today
      - blocked
      title: CheckinOutcome
      type: string
    CheckinResponse:
      properties:
        actual_minutes_delta:
          anyOf:
          - type: integer
          - type: 'null'
          description: 缺失表示未填写（unknown），不当作 0
          title: Actual Minutes Delta
        artifact_ids:
          items:
            type: string
          title: Artifact Ids
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        difficulty_code:
          anyOf:
          - $ref: '#/components/schemas/CheckinDifficulty'
          - type: 'null'
        id:
          title: Id
          type: string
        local_date:
          format: date
          title: Local Date
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        outcome:
          $ref: '#/components/schemas/CheckinOutcome'
        remaining_minutes_after:
          anyOf:
          - type: integer
          - type: 'null'
          title: Remaining Minutes After
        supersedes_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Supersedes Id
        task_id:
          title: Task Id
          type: string
        task_spec_id:
          title: Task Spec Id
          type: string
      required:
      - id
      - task_id
      - task_spec_id
      - local_date
      - outcome
      - actual_minutes_delta
      - created_at
      title: CheckinResponse
      type: object
    ClearUsageBindingRequest:
      description: 清除一个用途的绑定。软清除：config_id 置空、行保留、版本递增。
      properties:
        expected_revision:
          description: 乐观锁：无绑定行时为 0，否则为当前绑定版本；不匹配返回 REVISION_CONFLICT
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: ClearUsageBindingRequest
      type: object
    CloseGoalRequest:
      properties:
        closure_kind:
          $ref: '#/components/schemas/ClosureKind'
        criteria_confirmations:
          description: 成功标准逐条确认；随结束操作写入快照，撤销后可还原（17 号第 4 节）
          items:
            $ref: '#/components/schemas/CriterionConfirmation'
          title: Criteria Confirmations
          type: array
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        note:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Note
      required:
      - expected_revision
      - closure_kind
      - criteria_confirmations
      title: CloseGoalRequest
      type: object
    ClosureKind:
