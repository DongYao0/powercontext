      description: '用户级长期记忆的状态（RFC 0012 第 3 节）。


        只有 candidate 与 confirmed 参与后续流转：confirmed 可修改并推进 head；

        rejected 与 invalidated 都是终态，写入抑制指纹后正文不再检索或注入。

        状态变更的唯一执行者是记忆服务，其他模块只能调用其 Interface。'
      enum:
      - candidate
      - confirmed
      - rejected
      - invalidated
      title: MemoryStatus
      type: string
    MemoryType:
      description: '用户级长期记忆的类型（RFC 0012 第 2 节）。


        #135 的产品决定采用直译四型，枚举值保持英文。记忆只承载跨目标仍成立的用户陈述；

        目标、计划、任务与执行记录始终是业务事实，不得被记忆替代。'
      enum:
      - preference
      - stable_fact
      - experience
      - decision
      title: MemoryType
      type: string
    MessageResponse:
      properties:
        content:
          title: Content
          type: string
        conversation_id:
          title: Conversation Id
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Id
        quick_replies:
          description: AI 回复中每个追问的快捷选项；用户消息与没有选项的回复为空列表（RFC 0009）
          items:
            $ref: '#/components/schemas/QuickReplyResponse'
          title: Quick Replies
          type: array
        role:
          $ref: '#/components/schemas/MessageRole'
        sequence:
          minimum: 1.0
          title: Sequence
          type: integer
      required:
      - id
      - conversation_id
      - sequence
      - role
      - content
      - job_id
      - created_at
      title: MessageResponse
      type: object
    MessageRole:
      description: 持久化对话消息的发言方；模型内部 system/tool 消息不落用户对话表。
      enum:
      - user
      - assistant
      title: MessageRole
      type: string
    MessagesResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MessageResponse'
          title: Items
          type: array
        next_after_sequence:
          anyOf:
          - type: integer
          - type: 'null'
          description: 非空表示还有消息，下一页以此值作为 after_sequence
          title: Next After Sequence
      required:
      - items
      - next_after_sequence
      title: MessagesResponse
      type: object
    ModelApiMode:
      description: 'OpenAI 系供应商的 API 形态（07 号文档第 2 节）。


        仅 model_provider=openai 时有效，映射 langchain-openai 的 use_responses_api；

        anthropic 下必须为空，DB CHECK 强制该组合（T14 决策 A3）。'
      enum:
      - responses
      - chat_completions
      title: ModelApiMode
      type: string
    ModelCapabilities:
      description: '能力三态记录（07 号第 1 节；T14 决策 A8）。


        LangChain 用提示工程模拟结构化输出的组合记 unsupported，不伪报原生能力。'
      properties:
        basic_generation:
          $ref: '#/components/schemas/CapabilityState'
          description: 基本生成；能力门槛的最低项
        streaming:
          $ref: '#/components/schemas/CapabilityState'
          description: 流式输出；不可用时前端显示等待后完整返回
        structured_output:
          $ref: '#/components/schemas/CapabilityState'
          description: 原生 schema 结构化输出
      required:
      - basic_generation
      - structured_output
      - streaming
      title: ModelCapabilities
      type: object
    ModelConfigResponse:
      description: 个人配置的脱敏元数据。响应不包含任何凭证材料（T14 决策 A5）。
      properties:
        api_mode:
          anyOf:
          - $ref: '#/components/schemas/ModelApiMode'
          - type: 'null'
          description: 仅 openai 配置非空
        base_url:
          anyOf:
          - type: string
          - type: 'null'
          description: 自定义服务地址；null 表示官方默认端点
          title: Base Url
        capabilities:
          anyOf:
          - $ref: '#/components/schemas/ModelCapabilities'
          - type: 'null'
          description: 最近一次测试的能力记录；从未测试或最近一次失败为 null
        created_at:
          format: date-time
          title: Created At
          type: string
        enabled:
          description: false 表示用户已禁用；删除（归档）配置不出现在任何响应里
          title: Enabled
          type: boolean
        has_credential:
          description: 是否持有凭证；凭证材料本身绝不出现在响应中
          title: Has Credential
          type: boolean
        id:
          title: Id
          type: string
        is_default:
          description: 是否为当前用户默认配置；每用户至多一个
          title: Is Default
          type: boolean
        last_test_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 最近一次测试时间；从未测试为 null
          title: Last Test At
        model_id:
          description: 供应商模型名
          title: Model Id
          type: string
        model_provider:
          $ref: '#/components/schemas/ModelProvider'
        name:
          title: Name
          type: string
        revision:
          description: 配置版本；api_mode 等修改会递增
          title: Revision
          type: integer
        thinking_disabled:
          description: 是否显式关闭 Anthropic 思考模式；false 表示保留供应商行为
          title: Thinking Disabled
          type: boolean
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - name
      - model_provider
      - api_mode
      - base_url
      - model_id
      - thinking_disabled
      - revision
      - enabled
      - is_default
      - has_credential
      - capabilities
      - last_test_at
      - created_at
      - updated_at
      title: ModelConfigResponse
      type: object
    ModelProvider:
      description: '模型供应商（PRD D08 已确认双 provider）。


        取值直接作为 init_chat_model 的 model_provider 传入（07 号文档第 1 节）。

        禁止根据模型名称猜测 provider；配置上写哪个就是哪个。'
      enum:
      - openai
      - anthropic
      title: ModelProvider
      type: string
    ModelTestError:
      description: 测试失败信息。供应商原始错误脱敏后只保留分类与说明（07 号第 1 节）。
      properties:
        kind:
          $ref: '#/components/schemas/ModelTestErrorKind'
          description: 错误分类：鉴权/路径/限流/网络/协议
        message:
          description: 脱敏后的错误说明；不含供应商原始细节与凭证片段
          title: Message
          type: string
      required:
      - kind
      - message
      title: ModelTestError
      type: object
    ModelTestErrorKind:
      description: '连通性测试失败的错误分类（07 号文档第 1 节）。


        供应商原始错误信息脱敏后才进入响应，这里只保留定位所需的分类：

        鉴权/权限、路径/模型、限流、网络与响应协议五类。'
      enum:
      - auth
      - model_not_found
      - rate_limited
      - network
      - protocol
      title: ModelTestErrorKind
      type: string
    ModelTestOutcome:
      description: 连通性测试的总体结果（T14 决策 A7：结果在 200 响应体返回，不抛 MODEL_UNAVAILABLE）。
      enum:
      - succeeded
      - failed
      title: ModelTestOutcome
      type: string
    ModelTestResponse:
      description: 连通性测试结果。失败也走 200 响应体，不抛 MODEL_UNAVAILABLE（T14 决策 A7）。
      properties:
        capabilities:
          anyOf:
          - $ref: '#/components/schemas/ModelCapabilities'
          - type: 'null'
          description: 测试得出的能力记录；基本生成失败时为 null
        config_id:
          title: Config Id
          type: string
        config_revision:
          description: 测试所依据的配置版本；与当前 revision 不一致说明测试期间配置被修改
          title: Config Revision
          type: integer
        error:
          anyOf:
          - $ref: '#/components/schemas/ModelTestError'
          - type: 'null'
          description: 失败时的分类与脱敏说明；成功为 null
        outcome:
          $ref: '#/components/schemas/ModelTestOutcome'
        tested_at:
          format: date-time
          title: Tested At
          type: string
      required:
      - config_id
      - config_revision
      - outcome
      - capabilities
      - error
      - tested_at
      title: ModelTestResponse
      type: object
    ModelUsage:
      description: '模型用途（#105 第一批）：按调用步骤类别解析个人配置的维度。


        chat 是对话用途，继续由现有默认配置（is_default）承载，不进入用途绑定表；

        reasoning / lightweight 由 model_usage_bindings 的绑定行管理，未绑定时回退对话默认。

        本批不含 embedding 取值（RAG 检索方案定稿后再扩展）。'
      enum:
      - chat
      - reasoning
      - lightweight
      title: ModelUsage
      type: string
    ModelUsageBindingResponse:
      description: 一个模型用途的绑定视图（#105 第一批）。配置引用为脱敏元数据，不含凭证材料。
      properties:
        binding_revision:
          anyOf:
          - type: integer
          - type: 'null'
          description: 无绑定行为 null（首次写用 expected_revision=0）；已清除或空状态行为行内版本。chat 恒为 null（对话用途沿用默认配置，无绑定版本）
          title: Binding Revision
        binding_status:
          $ref: '#/components/schemas/ModelUsageBindingStatus'
          description: unbound=未绑定（回退对话默认）；bound=绑定指向本人可用配置；broken=指向的配置已禁用或删除，绑定保留待重新选择或清除
        bound_config_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 该配置当前是否启用；broken 与未绑定为 false/null
          title: Bound Config Enabled
        bound_config_id:
          anyOf:
          - type: string
          - type: 'null'
          description: 绑定（chat 为当前默认）配置的 ID；未绑定为 null
          title: Bound Config Id
        bound_config_name:
          anyOf:
          - type: string
          - type: 'null'
          description: 该配置的名称；未绑定为 null
          title: Bound Config Name
        fallback_to_chat:
          description: 该用途未绑定且会回退对话默认时为 true；bound/broken 与 chat 用途恒为 false
          title: Fallback To Chat
          type: boolean
        usage:
          $ref: '#/components/schemas/ModelUsage'
          description: 模型用途：chat / reasoning / lightweight
      required:
      - usage
      - binding_status
      - binding_revision
      - bound_config_id
      - bound_config_name
      - bound_config_enabled
      - fallback_to_chat
      title: ModelUsageBindingResponse
      type: object
    ModelUsageBindingStatus:
      description: '用途绑定视图的三态（#105 第一批）。


        unbound 是未绑定（无行或已清除），回退对话默认；bound 是绑定指向本人可用配置；

        broken 是指向的配置已禁用或归档——绑定行保留，提示重新选择或主动清除，不静默回退。'
      enum:
      - unbound
      - bound
      - broken
      title: ModelUsageBindingStatus
      type: string
