      description: '允许作为记忆证据的来源类型（RFC 0012 第 5 节）。


        首版只接受经来源模块只读 Interface 校验过的三类。任意 URL、模型自由文本与未经校验的

        job event 都不接受——它们的归属与版本无法在服务端复核。'
