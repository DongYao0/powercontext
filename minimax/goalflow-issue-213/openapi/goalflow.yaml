    post:
      description: '原子保存用户消息与回答作业；首次及幂等重放均返回 202 和同一作业引用，同一对话继续使用 `expected_revision` 与 `Idempotency-Key`。


        目标澄清会话提交 `goal_clarification` 作业；当前任务辅助会话提交 `task_assistance` 作业，回答时按服务端注入的账号与当前任务作用域做只读材料检索，检索失败时确定性降级为不使用材料证据、仅按任务上下文回答，不使本次作业失败。作业种类是
        `JobResponse.kind` 的自由字符串，不构成共享枚举，SSE 事件形状不变。


        错误语义：跨用户或不存在统一 404；同一 `Idempotency-Key` 配不同内容返回 409 `IDEMPOTENCY_KEY_CONFLICT`；`expected_revision`
        落后返回 409 `REVISION_CONFLICT`；默认模型配置不可用返回 503 `MODEL_UNAVAILABLE`。'
      operationId: submit_message_api_conversations__conversation_id__messages_post
      parameters:
      - description: 对话 ID
        in: path
        name: conversation_id
        required: true
        schema:
          description: 对话 ID
