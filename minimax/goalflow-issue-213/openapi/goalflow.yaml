        in: header
        name: Last-Event-ID
        required: false
        schema:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          description: 已收到的最后一个 sequence；浏览器重连时自动携带
          title: Last-Event-Id
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/JobEventMessage'
                type: string
          description: 事件流；schema 描述的是每条消息的 data
        '401':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 作业不存在，或不属于当前用户
        '422':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
      summary: 订阅作业事件（SSE）
      tags:
      - jobs
