          type: integer
        status:
          description: active / cleared；清除保留历史行（Q08）
          title: Status
          type: string
        task_id:
          title: Task Id
          type: string
      required:
      - revision
      - task_id
      - local_date
      - constraint_kind
      - status
      title: TaskConstraintResponse
      type: object
    TaskConversationsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConversationResponse'
          title: Items
          type: array
      required:
      - items
      title: TaskConversationsResponse
      type: object
    TaskDayConstraintKind:
      description: '单日任务约束（03 第 4 节 task_day_constraints.constraint_kind）。


        must_do_today 固定日期；locked 还固定当前分配分钟数（13 号第 4 节）。'
      enum:
      - must_do_today
      - locked
      title: TaskDayConstraintKind
      type: string
    TaskDependencyEdge:
      description: 关联携带的一条具体任务依赖（18 号第 2 节：不接受只有两个 goal_id 的"相关"声明）。
      properties:
        predecessor_task_id:
          description: 前驱任务（须先完成/通过的一方）
          maxLength: 36
          title: Predecessor Task Id
          type: string
        required_outcome:
          $ref: '#/components/schemas/DependencyOutcome'
          description: 满足条件：执行完成或验证通过
        successor_task_id:
          description: 后继任务
          maxLength: 36
          title: Successor Task Id
          type: string
      required:
      - predecessor_task_id
      - successor_task_id
      - required_outcome
      title: TaskDependencyEdge
      type: object
    TaskExecutionResponse:
      properties:
        execution_status:
          $ref: '#/components/schemas/TaskExecutionStatus'
        progress_revision:
          minimum: 0.0
          title: Progress Revision
          type: integer
        revision:
          minimum: 0.0
          title: Revision
          type: integer
        task_id:
          title: Task Id
          type: string
      required:
      - task_id
      - execution_status
      - progress_revision
      - revision
      title: TaskExecutionResponse
      type: object
    TaskExecutionStatus:
      description: '任务执行状态（03 第 3 节）。


        blocked 是排期计算得到的展示态，不落库；paused 目标下的任务不改写执行状态（D12）。'
      enum:
      - proposed
      - pending
      - in_progress
      - completed
      - cancelled
      title: TaskExecutionStatus
      type: string
    TaskExecutor:
      description: 任务的执行者类型（12 号第 4 节：用户任务、Agent 任务和协作任务分别计算用户投入）。
      enum:
      - user
      - agent
      - collaborative
      title: TaskExecutor
      type: string
    TestModelConfigRequest:
      description: 触发连通性测试。固定无私人内容短提示，超时与重试由服务端约束（决策 A7）。
      properties: {}
      title: TestModelConfigRequest
      type: object
    UndoClosureRequest:
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      title: UndoClosureRequest
      type: object
    UnlinkImpact:
      description: 解除提案的影响分析（18 号第 3 节）。结构随业务实现细化，首版用说明性键。
      properties:
        affected_milestones:
          description: 受影响的里程碑与期限
          items:
            additionalProperties: true
            type: object
          title: Affected Milestones
          type: array
        criteria_unsatisfiable:
          description: 完成标准引用了前驱产出、解除后将不可执行的后继任务
          items:
            additionalProperties: true
            type: object
          title: Criteria Unsatisfiable
          type: array
        satisfied_edges:
          description: 已满足的依赖边；随关联归档，无需处理
          items:
            additionalProperties: true
            type: object
          title: Satisfied Edges
          type: array
        unsatisfied_edges:
          description: 该关联下未满足的依赖边清单，每条含后继任务及其当前执行状态
          items:
            additionalProperties: true
            type: object
          title: Unsatisfied Edges
          type: array
      required:
      - unsatisfied_edges
      - criteria_unsatisfiable
      - affected_milestones
      - satisfied_edges
      title: UnlinkImpact
      type: object
    UpdateAvailabilityRequest:
      description: 提交周额度与生效日期（05-module-contracts update_availability）。
      properties:
        effective_from:
          description: 生效起始日期；旧版本保留，按日期选择
          format: date
          title: Effective From
          type: string
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        weekly_minutes:
          additionalProperties:
            type: integer
          description: 周一至周日七个额度（分钟），键为 monday…sunday
          title: Weekly Minutes
          type: object
      required:
      - expected_revision
      - effective_from
      - weekly_minutes
      title: UpdateAvailabilityRequest
      type: object
    UpdateDraftTaskRequest:
      properties:
        expected_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Expected Minutes
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        instructions:
          anyOf:
          - maxLength: 8000
            type: string
          - type: 'null'
          title: Instructions
        maximum_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Maximum Minutes
        minimum_minutes:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Minimum Minutes
        title:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      required:
      - expected_revision
      title: UpdateDraftTaskRequest
      type: object
    UpdateModelConfigRequest:
      description: '修改配置。provider 不可修改（换 provider 新建配置，T14 决策 A3）。


        字段缺省表示不变；base_url 显式 null 表示清除自定义地址、回到官方默认端点。

        api_key 缺省 = 保持原值，显式空串被拒——不存在掩码回显覆盖路径（决策 A5）。

        禁用（enabled=false）保留凭证、可重新启用；删除走 DELETE（决策 A12）。'
      properties:
        api_key:
          anyOf:
          - maxLength: 4096
            minLength: 1
            type: string
          - type: 'null'
          description: 替换凭证；缺省或 null 表示保持原值，显式空串被拒（422）
          title: Api Key
        api_mode:
          anyOf:
          - $ref: '#/components/schemas/ModelApiMode'
          - type: 'null'
          description: 仅 openai 配置可修改；修改视为配置版本变化（决策 A3）。anthropic 配置提交非空值被拒
        base_url:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          description: 显式 null 清除自定义地址；字段缺省表示不变（业务实现以字段提交状态区分）
          title: Base Url
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 缺省表示不变；false 禁用（凭证保留、可重新启用，06 号：支持替换、禁用和删除）。已删除配置按 404 处理，不能经此端点恢复
          title: Enabled
        expected_revision:
          description: 乐观锁：当前配置版本；不匹配返回 REVISION_CONFLICT
          minimum: 0.0
          title: Expected Revision
          type: integer
        model_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          description: 缺省表示不变
          title: Model Id
        name:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          description: 缺省表示不变
          title: Name
        thinking_disabled:
          description: 缺省保持原设置；显式 true 关闭 Anthropic 思考，false 恢复供应商行为；修改递增版本并使能力结果失效
          title: Thinking Disabled
          type: boolean
      required:
      - expected_revision
      title: UpdateModelConfigRequest
      type: object
    UpdateProfileDraftRequest:
      properties:
        edits:
          additionalProperties: true
          description: 用户对草稿的直接编辑；基于旧档案的模型预览将标记 stale（05 第 2 节）
          title: Edits
          type: object
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
      required:
      - expected_revision
      - edits
      title: UpdateProfileDraftRequest
      type: object
    UpdateSchedulingPreferencesRequest:
      description: 一次提交全部活动目标的 focus 状态与顺序（13 号第 8 节）。
      properties:
        expected_revision:
          description: 客户端读到的版本号。与服务端当前版本不一致时返回 REVISION_CONFLICT。
          minimum: 0.0
          title: Expected Revision
          type: integer
        preferences:
          items:
            $ref: '#/components/schemas/PreferenceInput'
          minItems: 1
          title: Preferences
          type: array
      required:
      - expected_revision
      - preferences
      title: UpdateSchedulingPreferencesRequest
      type: object
    UserRole:
      description: 账号角色。首位注册者不自动成为管理员，只能由部署者本地命令授予。
      enum:
      - user
      - admin
      title: UserRole
      type: string
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VerificationEvaluator:
      description: 验证结果的评判来源。首版只由规则层写初值；模型评估接线归 T08/T12。
      enum:
      - rule
      - model
      - user
      title: VerificationEvaluator
      type: string
    VerificationResultResponse:
      properties:
        checkin_id:
          title: Checkin Id
          type: string
        evaluator:
          $ref: '#/components/schemas/VerificationEvaluator'
        id:
          title: Id
          type: string
        policy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Version
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        status:
          $ref: '#/components/schemas/VerificationStatus'
        task_id:
          title: Task Id
          type: string
      required:
      - id
      - task_id
      - checkin_id
      - status
      - evaluator
      title: VerificationResultResponse
      type: object
    VerificationResultsResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/VerificationResultResponse'
          title: Items
          type: array
      required:
      - items
      title: VerificationResultsResponse
      type: object
    VerificationStatus:
      description: 结果验证状态，独立于执行状态（09 号第 2 节；R12 允许 completed 与 not_met 并存）。
      enum:
      - not_required
      - pending
      - passed
      - not_met
      - insufficient_evidence
      - error
      title: VerificationStatus
      type: string
info:
  description: GoalFlow 的 HTTP 契约事实源。本文档由 scripts/api-generate.sh 导出，禁止手工编辑。
  title: GoalFlow API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/agendas/{local_date}:
    get:
      description: 返回当前安排或缺失状态；读取不直接创建作业（05-module-contracts read_today）。
      operationId: read_agenda_api_agendas__local_date__get
      parameters:
      - description: 用户本地日期，格式 YYYY-MM-DD
        in: path
        name: local_date
        required: true
        schema:
          description: 用户本地日期，格式 YYYY-MM-DD
          format: date
          title: Local Date
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 日程、任务、目标或相关资源不存在，或不属于当前用户
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 读取某日安排
      tags:
      - scheduling
  /api/agendas/{local_date}/generation:
    post:
      description: 保证该日期存在基于最新 planning revision 的安排；已有有效安排则去重返回（13 号第 8 节）。异步：返回 202 与作业引用。
      operationId: ensure_agenda_api_agendas__local_date__generation_post
      parameters:
      - description: 用户本地日期，格式 YYYY-MM-DD
        in: path
        name: local_date
        required: true
        schema:
          description: 用户本地日期，格式 YYYY-MM-DD
          format: date
          title: Local Date
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnsureAgendaRequest'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 日程、任务、目标或相关资源不存在，或不属于当前用户
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 版本已更新（REVISION_CONFLICT）或时间预算冲突（BUDGET_CONFLICT）
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
      summary: 生成某日安排
      tags:
      - scheduling
  /api/agendas/{local_date}/task-constraints/{task_id}:
    put:
      description: 设置 must_do_today 或 locked，或清除既有约束；无法满足时返回容量冲突（13 号第 4 节）。
      operationId: constrain_today_task_api_agendas__local_date__task_constraints__task_id__put
      parameters:
      - description: 用户本地日期，格式 YYYY-MM-DD
        in: path
        name: local_date
        required: true
        schema:
          description: 用户本地日期，格式 YYYY-MM-DD
          format: date
          title: Local Date
          type: string
      - description: 任务 ID
        in: path
        name: task_id
        required: true
        schema:
          description: 任务 ID
          maxLength: 36
          title: Task Id
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstrainTaskRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskConstraintResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 日程、任务、目标或相关资源不存在，或不属于当前用户
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 版本已更新（REVISION_CONFLICT）或时间预算冲突（BUDGET_CONFLICT）
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
      summary: 设置单日任务约束
      tags:
      - scheduling
  /api/artifacts/{artifact_id}:
    delete:
      description: 软移除材料：置为 removed，并在同一写事务内使全文与语义派生索引失效（RFC 0011）。仅材料所有者可移除；跨用户与不存在统一返回 404。重复移除幂等，同样返回
        204。业务行与 check-in 引用历史保留，不做物理删除；磁盘文件正文不在本入口清理。
      operationId: remove_artifact_api_artifacts__artifact_id__delete
      parameters:
      - description: 材料 ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: 材料 ID
          maxLength: 36
          title: Artifact Id
          type: string
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 任务或记录不存在，或不属于当前用户
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 移除材料
      tags:
      - checkins
    get:
      description: 返回材料的元数据；链接与粘贴文本同时返回内容，文件内容经 /content 下载。仅材料所有者可读（D10）。
      operationId: get_artifact_api_artifacts__artifact_id__get
      parameters:
      - description: 材料 ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: 材料 ID
          maxLength: 36
          title: Artifact Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 任务或记录不存在，或不属于当前用户
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 读取材料信息
      tags:
      - checkins
  /api/artifacts/{artifact_id}/content:
    get:
      description: 按附件下载文件材料，禁止浏览器嗅探类型；仅材料所有者可读，非文件材料返回 404（D10）。
      operationId: download_artifact_api_artifacts__artifact_id__content_get
      parameters:
      - description: 材料 ID
        in: path
        name: artifact_id
        required: true
        schema:
          description: 材料 ID
          maxLength: 36
          title: Artifact Id
          type: string
      responses:
        '200':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录或会话失效
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 任务或记录不存在，或不属于当前用户
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: 下载文件材料
      tags:
      - checkins
  /api/auth/login:
    post:
      description: 账号不存在、密码错误、账号已禁用统一返回 INVALID_CREDENTIALS。已登录时再次登录会撤销旧会话。
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 未登录、会话失效或凭证错误
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求来源不受信任，或本实例已关闭注册
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 请求参数校验未通过
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 尝试次数过多，响应头 Retry-After 给出需等待的秒数
      summary: 登录
      tags:
      - auth
  /api/auth/logout:
    post:
      description: 未登录或会话已失效时同样返回 204。
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
